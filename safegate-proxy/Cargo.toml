[package]
name = "safegate-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
safegate-core = { path = "../safegate-core" }
safegate-wasm = { path = "../safegate-wasm" }
arc-swap = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
wiremock = "0.6"

[[bench]]
name = "proxy_benchmark"
harness = false
